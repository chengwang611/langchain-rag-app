version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: risk-review-pgvector
    environment:
      POSTGRES_DB: risk_review
      POSTGRES_USER: risk_user
      POSTGRES_PASSWORD: risk_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_user -d risk_review"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
